name: 'dbt_repo'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:

  dbt_repo:

    STG:
      +database: STG_DB
      +schema: STG
      +materialized: view

    CURATED:
      +database: STG_DB
      +schema: CURATED
      +materialized: table

    CONSUMPTION:
      +database: STG_DB
      +schema: CONSUMPTION
      +materialized: view

    AUDIT:
      +database: STG_DB
      +schema: AUDIT
      +materialized: table