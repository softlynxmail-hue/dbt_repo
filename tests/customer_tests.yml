version: 2

models:

  - name: customer

    columns:

      - name: customer_id

        tests:

          - unique:
              config:
                severity: error

          - not_null:
              config:
                severity: error

      - name: country

        tests:

          - not_null:
              config:
                severity: warn

          - accepted_values:
              arguments:
                values:
                  - USA
                  - INDIA
                  - GERMANY
                  - SPAIN
                  - UAE
              config:
                severity: warn

          - relationships:
              arguments:
                to: ref('country_lookup')
                field: country
              config:
                severity: error